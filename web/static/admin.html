<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>灵矽对讲 · 车队管理</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="admin-page">
<header class="admin-head">
  <h1>灵矽对讲 · 车队管理</h1>
  <span id="stats" class="stats"></span>
  <a class="link" href="/device" target="_blank">打开模拟对讲机 ↗</a>
</header>

<main class="admin">
  <aside class="admin-side">
    <section class="card">
      <h3>新建群</h3>
      <form id="create" class="col">
        <input name="name" placeholder="群名称，如：顺丰华东车队" required maxlength="20">
        <select name="template"></select>
        <div class="row">
          <select name="type">
            <option value="fixed">固定群</option>
            <option value="temp">临时群</option>
            <option value="emergency">紧急频道</option>
          </select>
          <select name="visibility">
            <option value="code">仅房间号 / 扫码</option>
            <option value="nearby">附近可见</option>
            <option value="route">路线可见</option>
          </select>
        </div>
        <input name="route" placeholder="路线，如：上海-成都 G42" hidden>
        <div class="row" data-geo hidden>
          <input name="lat" placeholder="纬度" inputmode="decimal">
          <input name="lng" placeholder="经度" inputmode="decimal">
        </div>
        <input name="owner_id" placeholder="车队长设备 ID（可选）">
        <button class="btn primary">创建</button>
      </form>
    </section>

    <section class="card">
      <h3>批量导入设备</h3>
      <form id="batch" class="col">
        <label for="batch-group">目标群</label>
        <select id="batch-group" name="group" required></select>
        <label for="batch-devices">设备列表</label>
        <textarea id="batch-devices" name="devices" rows="6" aria-describedby="batch-help batch-summary" placeholder="car-001,沪A12345&#10;car-002,沪B67890"></textarea>
        <p id="batch-help" class="batch-help">每行一台：设备ID,显示名。显示名可省略，支持中英文逗号或制表符分隔；不需要表头。</p>
        <p id="batch-summary" class="batch-summary" role="status" aria-live="polite"></p>
        <div id="batch-preview" class="batch-preview" hidden>
          <table aria-label="设备导入预览">
            <thead><tr><th>行</th><th>设备 ID</th><th>显示名</th><th>检查</th></tr></thead>
            <tbody id="batch-rows"></tbody>
          </table>
        </div>
        <label class="check"><input type="checkbox" name="pin" checked> 设为设备当前频道（固定频道）</label>
        <button id="batch-submit" class="btn primary" disabled>导入</button>
        <div id="batch-result" class="batch-result" role="status" aria-live="polite" hidden></div>
      </form>
    </section>
  </aside>

  <div class="admin-main">
    <section class="card stats-panel" aria-labelledby="stats-title">
      <header class="stats-head">
        <h3 id="stats-title">运营统计</h3>
        <select id="stats-hours" aria-label="统计时间范围">
          <option value="24">最近 24 小时</option>
          <option value="72">最近 3 天</option>
          <option value="168">最近 7 天</option>
        </select>
      </header>
      <div class="tiles" id="stats-tiles"></div>
      <figure class="chart">
        <figcaption>每小时通话时长（分钟）</figcaption>
        <div class="chart-plot" id="stats-chart"></div>
        <div class="chart-tip" id="stats-tip" hidden></div>
        <details class="chart-table"><summary>数据表</summary><table id="stats-hourly-table"></table></details>
      </figure>
      <div class="rank-row">
        <table class="rank" id="stats-groups"></table>
        <table class="rank" id="stats-devices"></table>
      </div>
    </section>
    <section id="groups" class="groups"></section>
  </div>
</main>

<dialog id="rec-dialog" class="rec-dialog">
  <header><h3 id="rec-title"></h3><button class="btn small" onclick="this.closest('dialog').close()">关闭</button></header>
  <ol id="rec-list" class="rec-list"></ol>
</dialog>

<script src="/static/admin.js"></script>
</body>
</html>
